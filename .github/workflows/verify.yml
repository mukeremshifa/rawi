name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixture-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run acceptance
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

