name: verify

# Verify only. This workflow deliberately does not deploy: a CI deploy that
# fails on a secret the owner has not created yet is worse than no CI deploy.
# Deployment is one owner-run command after a green gate (docs/OPERATIONS.md).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The whole gate runs with no credentials: VITE_API_MODE defaults to
      # `fake` and RAWI_AI_MODE defaults to `fixture`.
      - run: npm run verify
