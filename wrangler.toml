name = "rawi"
main = "src/server/index.ts"
compatibility_date = "2024-12-30"

# Static assets are served by the platform, not by Worker code, so asset
# requests do not consume the Free plan's per-request CPU budget.
[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"

[vars]
# R01 is fixture-only. No provider key is read anywhere in this codebase.
RAWI_TUTOR_MODE = "fixture"

# Supabase project URL — safe to commit; it is the public endpoint.
# Override for production by setting wrangler secret or editing this value.
# SUPABASE_URL and SUPABASE_ANON_KEY are safe to include here.
# SUPABASE_SERVICE_KEY is secret — never add it here; add it with:
# wrangler secret put SUPABASE_SERVICE_KEY
SUPABASE_URL = "https://gxbexwtopazokvmpfyzj.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_vIXynYAvskDpPrUhIH8aXw_-JviV1JT"

# ─── Secrets (add via wrangler CLI, not this file) ───────────────────────────
# wrangler secret put SUPABASE_SERVICE_KEY
# Local development reads all Supabase values from .dev.vars (gitignored).
